[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "khmer_nlp_toolkits"
version = "0.2.2"
description = "Khmer NLP toolkits"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/IDRI-LAB/khmer-nlp-toolkits"
Documentation = "https://IDRI-LAB.github.io/khmer-nlp-toolkits/"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
packages = { find = { include = ["khmer_nlp_toolkits", "khmer_nlp_toolkits.*"] } }
include-package-data = true

[tool.setuptools.package-data]
khmer_nlp_toolkits = [
    "utils/segment/model/*.bin",
    "transliterate/model/*.bin"
]
